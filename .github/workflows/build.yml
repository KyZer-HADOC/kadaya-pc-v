name: Build Kadaya PC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $exe = Get-ChildItem godot -Filter "*.exe" -Recurse | Select-Object -First 1
          echo "GODOT_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Import project
        shell: pwsh
        run: '& "$env:GODOT_EXE" --headless --path . --editor --quit'

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" "build/Kadaya.exe"
          if (!(Test-Path "build/Kadaya.exe")) { throw "Kadaya.exe was not created." }

      - name: Zip game
        shell: pwsh
        run: Compress-Archive -Path "build/Kadaya.exe" -DestinationPath "Kadaya-PC-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kadaya-PC-Windows
          path: Kadaya-PC-Windows.zip
